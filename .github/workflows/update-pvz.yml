# Save this file as: .github/workflows/update-pvz.yml
# in your OmidBehzadpoor/OmidBehzadpoor profile repository.
#
# It regenerates pvz-contrib.gif every day from your live contribution
# graph and commits it back, so the animation in your README stays current.

name: Update PvZ Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate PvZ contribution GIF
        run: python3 pvz_contrib.py ${{ github.repository_owner }} pvz-contrib.gif

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pvz-contrib.gif
          git diff --staged --quiet || git commit -m "chore: update PvZ contribution graph"
          git push
