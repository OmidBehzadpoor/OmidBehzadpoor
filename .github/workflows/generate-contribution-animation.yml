# Regenerates github-contribution-animation.svg every day from your live
# GitHub contribution graph and commits it back, so the animation in your
# README stays current.
#
# Generator: https://github.com/Man0dya/Readme-Contribution-Graph-Generator

name: Generate Contribution Animation

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: generate-contribution-animation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch generator script
        # Pulled fresh from the upstream repo on every run so it always
        # matches the latest version of the tool. If you'd rather pin a
        # copy, download scripts/generate-svg.cjs from the source repo and
        # commit it into your own scripts/ folder instead of this step.
        run: |
          mkdir -p scripts
          curl -fsSL -o scripts/generate-svg.cjs \
            https://raw.githubusercontent.com/Man0dya/Readme-Contribution-Graph-Generator/main/scripts/generate-svg.cjs

      - name: Generate animated SVGs
        run: node scripts/generate-svg.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution animation [skip ci]"
          file_pattern: "*-contribution-animation.svg contribution-animation.svg github-contribution-animation.svg"
