# Regenerates the contribution-graph animation SVGs every day from your live
# GitHub contribution graph and publishes them to a separate `output` branch.
#
# Why a separate branch? Commits on non-default branches are NOT counted in
# your contribution graph, so this workflow never inflates your stats and
# never pollutes the history of `main`.
#
# Generator: https://github.com/Man0dya/Readme-Contribution-Graph-Generator

name: Generate Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: generate-contribution-animation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch generator script
        # Security note: this downloads and runs code from another repo.
        # To pin it, replace `main` in the URL with a specific commit SHA,
        # or copy the script into your own scripts/ folder and delete this step.
        run: |
          mkdir -p scripts
          curl -fsSL -o scripts/generate-svg.cjs \
            https://raw.githubusercontent.com/Man0dya/Readme-Contribution-Graph-Generator/main/scripts/generate-svg.cjs

      - name: Generate animated SVGs
        run: node scripts/generate-svg.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        run: |
          mkdir -p /tmp/out
          cp github-contribution-animation.svg github-contribution-animation-dark.svg /tmp/out/
          cd /tmp/out
          git init -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update contribution animation"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
